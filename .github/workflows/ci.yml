name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Korpus-Test gegen die Base-App-Layouts (github.com/microsoft/BCApps), nächtlich
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Integrationstests (VS Code unter xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
        env:
          BC_RB_TIMEOUT_SCALE: '3'
      - name: Lokalisierung Deutsch (Bundle bis in die Webview)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
        env:
          BC_RB_TIMEOUT_SCALE: '3'
          BC_RB_TEST_LANGUAGE: de
          BC_RB_ONLY: Lokalisierung
      - name: Integrationstests (VS Code unter Windows)
        if: runner.os == 'Windows'
        run: npm run test:vscode
        env:
          BC_RB_TIMEOUT_SCALE: '3'
      - name: Deutsche Webview unter Windows
        if: runner.os == 'Windows'
        run: npm run test:vscode
        env:
          BC_RB_TIMEOUT_SCALE: '3'
          BC_RB_TEST_LANGUAGE: de
          BC_RB_ONLY: 'Lokalisierung|UI:'
      - name: Eingeschränkter Modus unter Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode:untrusted
        env:
          BC_RB_TIMEOUT_SCALE: '3'
      - name: Eingeschränkter Modus unter Windows
        if: runner.os == 'Windows'
        run: npm run test:vscode:untrusted
        env:
          BC_RB_TIMEOUT_SCALE: '3'
      - name: VSIX bauen und prüfen
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: bc-report-builder-${{ runner.os }}
          path: artifacts/*.vsix
          if-no-files-found: error

  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
