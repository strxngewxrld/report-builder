name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Korpus-Test gegen die Base-App-Layouts (github.com/microsoft/BCApps), nächtlich
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Integrationstests (VS Code unter xvfb)
        run: xvfb-run -a npm run test:vscode
        env:
          BC_RB_TIMEOUT_SCALE: '3'
      - name: Lokalisierung Deutsch (Bundle bis in die Webview)
        run: xvfb-run -a npm run test:vscode
        env:
          BC_RB_TIMEOUT_SCALE: '3'
          BC_RB_TEST_LANGUAGE: de
          BC_RB_ONLY: Lokalisierung
      - name: VSIX bauen
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
